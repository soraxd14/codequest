<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeQuest</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#14172b">
<style>
:root{--bg:#14172b;--card:#1e2240;--ink:#f1f0ff;--mute:#9a9cc4;--gold:#ffc24b;--coral:#ff6b6b;--teal:#3ddbc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f3f2ff;--card:#fff;--ink:#1b1d3a;--mute:#5d5f86}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;max-width:640px;padding:14px 14px 90px}
h1{font-size:26px;margin:4px 0}h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.lvl{font-size:44px;font-weight:800;color:var(--gold);line-height:1}
.bar{height:12px;background:#0003;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:width .5s}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--gold);color:#1b1d3a;font-weight:700;cursor:pointer;min-height:44px}
button.alt{background:#8884;color:var(--ink)}button.del{background:var(--coral);color:#fff}button:disabled{opacity:.4}
.logos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.lg{flex:0 0 auto;width:76px;text-align:center;border-radius:14px;padding:8px 4px;border:2px solid transparent;cursor:pointer;background:#0002}
.lg.on{border-color:var(--gold)}.lg b{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 4px;border-radius:12px;font-size:15px;color:#fff}
.q{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #8883}.q:last-child{border:0}.q input{width:26px;height:26px;accent-color:var(--teal)}
.coach{border-left:4px solid var(--teal);padding-left:12px}
pre{background:#0006;color:#e9e8ff;padding:12px;border-radius:12px;overflow-x:auto;font-size:13px;margin:8px 0;white-space:pre-wrap}
textarea{width:100%;height:190px;background:#0006;color:#e9e8ff;border:0;border-radius:12px;padding:10px;font:13px/1.4 monospace;tab-size:2}
iframe{width:100%;height:150px;border:0;border-radius:12px;background:#fff;margin-top:8px}
.days{display:flex;gap:6px;align-items:flex-end;height:110px}.days div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.days span{display:block;background:var(--teal);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
input[type=time],#nm{font:inherit;padding:8px;border-radius:10px;border:0;background:#8884;color:var(--ink)}
.st{padding:6px 0}.st.cur{font-weight:700;color:var(--gold)}.st.ok{color:var(--teal)}
.fb{padding:10px 12px;border-radius:12px;margin-top:8px;background:#0003}.fb.bad{border-left:4px solid var(--coral)}.fb.good{border-left:4px solid var(--teal)}
.bd{display:inline-block;margin:3px;padding:4px 10px;border-radius:20px;background:#ffc24b33;font-size:13px}
#md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}
#mc{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
#lid{transition:transform .6s;transform-origin:10px 40px}#ch{cursor:pointer}
.cert{border:3px double var(--gold);border-radius:14px;padding:16px;margin-bottom:10px}.cert #nm{text-align:center;font-size:20px;font-weight:700;width:100%;background:transparent;border-bottom:2px solid var(--gold);border-radius:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1b1d3a;padding:10px 18px;border-radius:20px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:10}#toast.s{opacity:1}
</style></head><body>
<h1>CodeQuest</h1><div class="mute">Learn, build, debug and level up.</div>

<div class="card"><div class="row sp"><div><div class="lvl" id="lv"></div><div id="rank" style="font-weight:700"></div></div>
<div style="text-align:right"><div id="xp" style="font-size:22px;font-weight:800"></div><div class="mute" id="streak"></div></div></div>
<div class="bar" style="margin-top:12px"><i id="fill"></i></div><div class="mute" id="next" style="margin-top:6px"></div></div>

<div class="card"><h2>Choose your path</h2><div class="logos" id="logos"></div></div>

<div class="card coach"><h2>Coach says</h2><div id="tip"></div><pre id="code"></pre>
<div class="row"><button id="learn">I learned this (+15 XP)</button><button class="alt" id="nextTip">Next lesson</button></div></div>

<div class="card"><h2 id="ptitle">Projects</h2><div id="plist"></div></div>

<div class="card" id="ws" hidden><h2 id="pt"></h2><div id="steps"></div>
<textarea id="pcode" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
<div class="row" style="margin:8px 0"><button id="prun">Run</button><button class="alt" id="prst">Reset code</button><button class="alt" id="pcl">Close</button></div>
<iframe id="pv" sandbox="allow-scripts" title="Preview" hidden></iframe>
<pre id="pout">Output appears here.</pre><div id="fb"></div></div>

<div class="card"><h2>Today's quests</h2><div id="quests"></div></div>
<div class="card"><h2>Trophy room</h2><div id="trophy"></div></div>
<div class="card"><h2>Last 7 days</h2><div class="days" id="days"></div><div class="mute" id="verdict" style="margin-top:8px"></div></div>
<div class="card"><h2>Daily reminder</h2><div class="row"><input type="time" id="rt" value="19:00"><button id="rem">Turn on</button></div>
<div class="mute" style="margin-top:6px">Alerts work while the app is open.</div></div>
<div class="card"><h2>Progress</h2><div class="row"><button id="save">Save progress</button><button class="del" id="reset">Delete progress</button></div><div class="mute" style="margin-top:6px" id="saved"></div></div>
<div class="card"><h2>Career ladder</h2><div id="ladder" class="mute"></div></div>
<div id="md" hidden><div id="mc"></div></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const LANGS={Python:{c:"#3776ab",a:"Py",t:[["Variables store values.","name = 'Sam'\nage = 25\nprint(name, age)"],["Loops repeat work.","for i in range(3):\n    print('Day', i+1)"]]},
Java:{c:"#e76f00",a:"Jv",t:[["Java runs from main. Every statement ends with ;","int age = 25;\nSystem.out.println(age);"],["Loops repeat work.","for (int i = 0; i < 3; i++) {\n  System.out.println(i);\n}"]]},
HTML:{c:"#e44d26",a:"</>",t:[["HTML gives a page structure. Close every tag you open.","<h1>My site</h1>\n<p>Hello</p>"],["Links connect pages.","<a href=\"https://example.com\">Visit</a>"]]},
JS:{c:"#c9a800",a:"JS",t:[["JavaScript makes pages react.","let n = 0;\nn = n + 1;\nconsole.log(n);"],["Functions package logic.","function hi(x){ return 'Hi ' + x; }\nconsole.log(hi('Sam'));"]]}};
const RANKS=[["Beginner",0],["Junior",300],["Mid-level",900],["Senior",2000],["Expert",4000]];
const SK=["First Steps","Variables","Printing Output","Debugging","Loops","Conditions","Functions","Problem Solving","Clean Code","Testing","Building Projects","Algorithms"];
const QUESTS=[["Code for 30 minutes",20],["Finish one coach lesson",15],["Fix one bug",20],["Read someone else's code",10],["Save your work",10]];
const PROJ=[
{id:"py1",l:"Python",min:0,n:"Tip Calculator",d:"Work out a restaurant tip.",code:"bill = 50\ntip_percent = 20\n# Write your code below\n",steps:[
 {t:"Create tip = bill * tip_percent / 100",h:"Write: tip = bill * tip_percent / 100",re:/tip\s*=\s*bill\s*\*\s*tip_percent\s*\/\s*100/},
 {t:"Create total = bill + tip",h:"Write: total = bill + tip",re:/total\s*=\s*bill\s*\+\s*tip/},
 {t:"Print the total (should show 60)",h:"Write: print('Total:', total)",re:/print\s*\(/,out:/60/}]},
{id:"py2",l:"Python",min:1,n:"Grade Checker",d:"Turn a score into a letter grade.",code:"score = 78\n# Write your code below\n",steps:[
 {t:"Start with: if score >= 90:",h:"Remember the colon and indent the next line 4 spaces.",re:/if\s+score\s*>=\s*90\s*:/},
 {t:"Add: elif score >= 70:",h:"elif goes at the same indent as if.",re:/elif\s+score\s*>=\s*70\s*:/},
 {t:"Add else: and print the grade (should print B)",h:"Each branch prints a letter, e.g. print('B')",re:/else\s*:/,out:/^B$/m}]},
{id:"j1",l:"Java",min:0,n:"Age in Days",d:"Convert years into days.",code:"public class Main {\n  public static void main(String[] args) {\n    int age = 20;\n    // Write your code below\n\n  }\n}",steps:[
 {t:"Create: int days = age * 365;",h:"Don't forget the semicolon ; at the end.",re:/int\s+days\s*=\s*age\s*\*\s*365\s*;/},
 {t:"Print days with System.out.println (should show 7300)",h:"System.out.println(days);",re:/System\.out\.println\s*\(/,out:/7300/}]},
{id:"j2",l:"Java",min:2,n:"FizzBuzz",d:"The classic interview question.",code:"public class Main {\n  public static void main(String[] args) {\n    // Write your code below\n\n  }\n}",steps:[
 {t:"Write a loop from 1 to 15",h:"for (int i = 1; i <= 15; i++) { }",re:/for\s*\(\s*int\s+i\s*=\s*1\s*;\s*i\s*<=\s*15/},
 {t:"Print Fizz when i % 3 == 0",h:"if (i % 3 == 0) { System.out.println(\"Fizz\"); }",re:/i\s*%\s*3/,out:/Fizz/},
 {t:"Print FizzBuzz when i % 15 == 0 (check it first)",h:"Put the % 15 check before the % 3 check, using else if.",re:/i\s*%\s*15/,out:/^FizzBuzz$/m}]},
{id:"h1",l:"HTML",min:0,n:"Profile Card",d:"Build your own intro page.",code:"<!-- Write your code below -->\n<style>body{font-family:sans-serif;padding:16px}</style>\n",steps:[
 {t:"Add an <h1> with your name",h:"<h1>Sam</h1>",re:/<h1[^>]*>[^<]+<\/h1>/},
 {t:"Add a <p> about you",h:"<p>I'm learning to code.</p>",re:/<p[^>]*>[^<]+<\/p>/},
 {t:"Add a link with <a href=\"...\">",h:"<a href=\"https://github.com\">My GitHub</a>",re:/<a\s+href=/}]},
{id:"h2",l:"HTML",min:1,n:"Color Switcher",d:"A button that changes the page.",code:"<!-- Write your code below -->\n",steps:[
 {t:"Add a <button> with an id",h:"<button id=\"b\">Change</button>",re:/<button[^>]*id=/},
 {t:"Add a <script> block",h:"<script> ... </script> goes after the button.",re:/<script>[\s\S]*<\/script>/},
 {t:"On click, change document.body.style.background",h:"document.getElementById('b').onclick = () => { document.body.style.background = 'gold'; };",re:/style\.background/}]},
{id:"js1",l:"JS",min:0,n:"Counter",d:"Your first function.",code:"let count = 0;\n// Write your code below\n",steps:[
 {t:"Write function add() that does count = count + 1",h:"function add() { count = count + 1; }",re:/function\s+add\s*\(\s*\)/},
 {t:"Call add() three times",h:"add(); add(); add();",re:/add\(\)[\s\S]*add\(\)[\s\S]*add\(\)/},
 {t:"console.log(count) (should show 3)",h:"console.log(count);",re:/console\.log\(count\)/,out:/^3$/m}]},
{id:"js2",l:"JS",min:2,n:"Calculator",d:"A function with real logic.",code:"function calc(a, op, b) {\n  // Write your code here\n}\nconsole.log(calc(6, '*', 7));\n",steps:[
 {t:"Handle + - * / using switch or if",h:"switch (op) { case '+': return a + b; }",re:/switch\s*\(|if\s*\(\s*op/},
 {t:"Guard against dividing by zero",h:"if (b === 0) return 'Cannot divide by zero';",re:/b\s*===?\s*0/},
 {t:"Make calc(6, '*', 7) print 42",h:"Add case '*': return a * b;",re:/\*/,out:/^42$/m}]}];
const fresh=()=>({xp:0,lang:"Python",tip:0,days:{},done:{},proj:{},skills:[],certs:[],name:"",remind:null,savedAt:null});
let S=fresh(),Q=[],cur=null,KEY="codequest_v2";
const today=()=>new Date().toISOString().slice(0,10);
function load(){try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(fresh(),JSON.parse(r));$("saved").textContent="Loaded your saved progress."}}catch(e){}}
function persist(){try{S.savedAt=new Date().toLocaleString();localStorage.setItem(KEY,JSON.stringify(S));$("saved").textContent="Saved "+S.savedAt;return true}catch(e){$("saved").textContent="Saving isn't available here.";return false}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),1800)}
function rankIdx(){let i=0;RANKS.forEach((r,k)=>{if(S.xp>=r[1])i=k});return i}
const lvl=()=>Math.floor(S.xp/100)+1;
function add(n){const o=lvl(),old=rankIdx();S.xp=Math.max(0,S.xp+n);const d=today();S.days[d]=Math.max(0,(S.days[d]||0)+n);
 const nl=lvl(),r=rankIdx();
 for(let l=o+1;l<=nl;l++){const sk=SK[(l-2)%SK.length];S.skills.push({l,sk});Q.push({l,sk,rank:(r>old&&l===nl)?RANKS[r][0]:null})}
 if(r>old)S.certs.push({r:RANKS[r][0],d:today()});
 persist();render();if(Q.length&&$("md").hidden)showChest();else if(!Q.length)toast((n>0?"+":"")+n+" XP")}
function showChest(){const c=Q[0];if(!c){$("md").hidden=true;return}$("md").hidden=false;
 $("mc").innerHTML=`<h2>Level ${c.l} reached!</h2><svg id="ch" viewBox="0 0 120 100" width="170"><g id="lid"><path d="M10 40 Q60 0 110 40Z" fill="#b8742f"/></g><rect x="10" y="40" width="100" height="50" rx="6" fill="#8a5420"/><rect x="52" y="34" width="16" height="22" rx="3" fill="#ffc24b"/></svg><div id="rw" class="mute">Tap the chest to open it</div>`;
 $("ch").onclick=()=>{$("lid").style.transform="rotate(-65deg)";$("rw").innerHTML=`<div style="font-size:20px;color:var(--gold);margin:8px 0">🏅 Skill unlocked: ${c.sk}</div>`+(c.rank?`<p>You're now a ${c.rank} developer!</p><button id="vc">View certificate</button> `:"")+`<button class="alt" id="nx">Continue</button>`;
  $("nx").onclick=()=>{Q.shift();showChest()};if(c.rank)$("vc").onclick=()=>cert(c.rank)}}
function cert(r){$("md").hidden=false;$("mc").innerHTML=`<div class="cert"><div style="font-size:38px;color:var(--teal)">&lt;/&gt;</div><h2>Certificate of Achievement</h2><p>This certifies that</p><input id="nm" placeholder="Type your name"><p>reached <b>${r} developer</b> on CodeQuest and unlocked ${S.skills.length} skills.</p><p class="mute">${today()}</p></div><div class="mute">Screenshot it to share or add to your portfolio.</div><button class="alt" id="cl" style="margin-top:10px">Close</button>`;
 $("nm").value=S.name||"";$("nm").oninput=e=>{S.name=e.target.value};$("cl").onclick=()=>{persist();showChest()}}
function streak(){let s=0,d=new Date();for(;;){const k=d.toISOString().slice(0,10);if((S.days[k]||0)>0){s++;d.setDate(d.getDate()-1)}else if(k===today()){d.setDate(d.getDate()-1)}else break}return s}
function render(){const i=rankIdx();
 $("lv").textContent="Lv "+lvl();$("rank").textContent=RANKS[i][0]+" developer";$("xp").textContent=S.xp+" XP";$("streak").textContent=streak()+"-day streak";
 const lo=RANKS[i][1],hi=RANKS[i+1]?RANKS[i+1][1]:null;
 if(hi){$("fill").style.width=((S.xp-lo)/(hi-lo)*100)+"%";$("next").textContent=(hi-S.xp)+" XP to "+RANKS[i+1][0]}else{$("fill").style.width="100%";$("next").textContent="Top rank reached."}
 $("logos").innerHTML=Object.keys(LANGS).map(k=>`<div class="lg ${k===S.lang?"on":""}" data-l="${k}"><b style="background:${LANGS[k].c}">${LANGS[k].a}</b><span style="font-size:13px">${k}</span></div>`).join("");
 document.querySelectorAll(".lg").forEach(e=>e.onclick=()=>{S.lang=e.dataset.l;S.tip=0;$("ws").hidden=true;render()});
 const T=LANGS[S.lang].t,t=T[S.tip%T.length];$("tip").textContent=t[0];$("code").textContent=t[1];
 $("ptitle").textContent=S.lang+" projects";
 $("plist").innerHTML=PROJ.filter(p=>p.l===S.lang).map(p=>{const st=S.proj[p.id]||{ok:[]},lock=i<p.min,n=(st.ok||[]).filter(Boolean).length;
  return `<div class="q"><div style="flex:1"><b>${p.n}</b><div class="mute">${p.d}</div><div class="mute">${lock?"🔒 Reach "+RANKS[p.min][0]+" to unlock":st.done?"✔ Completed":n+"/"+p.steps.length+" steps"}</div></div><button ${lock?"disabled":""} data-p="${p.id}">${st.done?"Replay":"Open"}</button></div>`}).join("");
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>openP(b.dataset.p));
 const d=today(),dn=S.done[d]||[];
 $("quests").innerHTML=QUESTS.map((q,k)=>`<label class="q"><input type="checkbox" data-k="${k}" ${dn.includes(k)?"checked":""}><span style="flex:1">${q[0]}</span><span class="mute">+${q[1]}</span></label>`).join("");
 document.querySelectorAll(".q input").forEach(e=>e.onchange=()=>{const k=+e.dataset.k;S.done[d]=S.done[d]||[];if(e.checked){S.done[d].push(k);add(QUESTS[k][1])}else{S.done[d]=S.done[d].filter(x=>x!==k);add(-QUESTS[k][1])}});
 $("trophy").innerHTML=(S.skills.length?S.skills.map(s=>`<span class="bd">🏅 ${s.sk}</span>`).join(""):"<span class='mute'>Level up to open chests and collect skills.</span>")+"<div style='margin-top:8px'>"+S.certs.map(c=>`<button class="alt" data-c="${c.r}">🎓 ${c.r} certificate</button> `).join("")+"</div>";
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>cert(b.dataset.c));
 const L=[];let act=0;for(let n=6;n>=0;n--){const x=new Date();x.setDate(x.getDate()-n);const v=S.days[x.toISOString().slice(0,10)]||0;if(v>0)act++;L.push([["Su","Mo","Tu","We","Th","Fr","Sa"][x.getDay()],v])}
 const mx=Math.max(40,...L.map(a=>a[1]));$("days").innerHTML=L.map(a=>`<div><span style="height:${a[1]/mx*80}px"></span>${a[0]}<br>${a[1]}</div>`).join("");
 $("verdict").textContent=act>=5?"Great week: "+act+" active days. You're leveling up.":act>=3?"Good start: "+act+" active days. Aim for 5.":"Only "+act+" active day(s). Do one small quest today.";
 $("ladder").innerHTML=RANKS.map((r,k)=>(k<=i?"✔ ":"○ ")+r[0]+" ("+r[1]+" XP)").join("<br>");
 if(S.cur)steps()}
/* ---------- project lab ---------- */
const BR="<script>window.onerror=function(m,s,l){parent.postMessage({cq:1,err:m,line:l},'*');return true};console.log=function(){parent.postMessage({cq:1,out:[].slice.call(arguments).join(' ')},'*')}<\/script>";
addEventListener("message",e=>{if(e.data&&e.data.cq&&cur)cur(e.data)});
function execJS(code,html){return new Promise(res=>{const o=[];let err=null,line=null;cur=m=>{if(m.out!==undefined)o.push(m.out);if(m.err){err=m.err;line=m.line}};
 let f=$("pv");if(!html){f=document.createElement("iframe");f.sandbox="allow-scripts";f.hidden=true;document.body.appendChild(f)}
 f.srcdoc=BR+(html?code:"<script>"+code+"<\/script>");
 setTimeout(()=>{cur=null;if(!html)f.remove();res({out:o.join("\n"),err,line})},800)})}
async function runPy(code){
 if(!window.pyodide){$("pout").textContent="Loading Python (first time only, needs internet)…";
  await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";s.onload=ok;s.onerror=()=>no("Couldn't load Python. Check your internet connection.");document.head.appendChild(s)});
  window.pyodide=await loadPyodide()}
 const o=[];pyodide.setStdout({batched:s=>o.push(s)});
 try{await pyodide.runPythonAsync(code);return{out:o.join("\n")}}
 catch(e){const m=String(e.message||e).trim(),L=m.match(/<exec>", line (\d+)/);return{out:o.join("\n"),err:m.split("\n").pop(),line:L?L[1]:null}}}
function runJava(code){const L=code.split("\n"),E=(err,line)=>({err,line});
 if(!/class\s+\w+/.test(code))return E("Every Java program needs a class: public class Main { ... }");
 if(!/void\s+main\s*\(/.test(code))return E("Java starts at main. Add: public static void main(String[] args) { ... }");
 const c=(a,b)=>(code.match(a)||[]).length!==(code.match(b)||[]).length;
 if(c(/\{/g,/\}/g))return E("Your { and } don't match. Every opening brace needs a closing one.");
 if(c(/\(/g,/\)/g))return E("Your ( and ) don't match. Check your brackets.");
 for(let i=0;i<L.length;i++){const t=L[i].replace(/\/\/.*$/,"").trim();if(!t)continue;
  if((t.match(/"/g)||[]).length%2)return E("Missing a closing quote \".",i+1);
  if(/\bstring\s+\w+/.test(t))return E("Java types are case-sensitive: write String with a capital S.",i+1);
  const m=t.match(/System\.out\.(\w+)/);if(m&&!/^(println|print)$/.test(m[1]))return E("Unknown method System.out."+m[1]+". Did you mean println?",i+1);
  if(/^(int|double|long|boolean|String|char|System\.|\w+\s*=[^=]|\w+(\+\+|--))/.test(t)&&!/[;{}]$/.test(t))return E("Missing a semicolon ; at the end of this line.",i+1)}
 const mm=code.match(/void\s+main\s*\([^)]*\)\s*\{([\s\S]*)\}\s*\}\s*$/);if(!mm)return E("Couldn't read main(). Check the closing braces } at the end.");
 const js=mm[1].replace(/\b(int|double|long|float|boolean|String|char)\s+(\w+)/g,"let $2").replace(/System\.out\.print(ln)?\(/g,"console.log(");
 return execJS(js,false)}
function htmlCheck(c){c=c.replace(/<!--[\s\S]*?-->/g,"");for(const t of["h1","h2","p","a","div","ul","li","button","span","section","script","style"]){const o=(c.match(new RegExp("<"+t+"[\\s>]","g"))||[]).length,x=(c.match(new RegExp("</"+t+">","g"))||[]).length;if(o!==x)return`You opened <${t}> ${o} time(s) but closed it ${x} time(s). Add the missing </${t}>.`}return null}
function coach(e,n){const at=n?` (near line ${n})`:"";
 if(/not defined/.test(e)){const nm=(e.match(/'(\w+)' is not defined/)||e.match(/(\w+) is not defined/)||[])[1];return`"${nm}" doesn't exist${at}. Check the spelling (capitals matter) or create it before using it.`}
 if(/IndentationError/.test(e))return`Indentation problem${at}: lines inside if/for/def need the same number of spaces.`;
 if(/SyntaxError|invalid syntax|Unexpected|expected/.test(e))return`Syntax mistake${at}: look for a missing colon, quote, bracket or semicolon. Original message: ${e}`;
 if(/TypeError/.test(e))return`Type mismatch${at}: you may be mixing text and numbers, or calling something that isn't a function.`;
 if(/ZeroDivision/.test(e))return"You divided by zero. Check the number you're dividing by.";
 return e+(n?" (line "+n+")":"")}
function steps(){const p=PROJ.find(x=>x.id===S.cur),st=S.proj[p.id];let c=false;
 $("steps").innerHTML=p.steps.map((s,i)=>{const ok=st.ok[i],isC=!ok&&!c;if(isC)c=true;return`<div class="st ${ok?"ok":isC?"cur":""}">${ok?"✔":"○"} Step ${i+1}: ${s.t}</div>`}).join("")}
function openP(id){const p=PROJ.find(x=>x.id===id);S.cur=id;const st=S.proj[id]=S.proj[id]||{code:p.code,ok:[]};
 $("ws").hidden=false;$("pt").textContent=p.n;$("pcode").value=st.code;$("pv").hidden=p.l!=="HTML";$("pv").srcdoc="";$("pout").textContent="Output appears here.";$("fb").innerHTML="";steps();$("ws").scrollIntoView({behavior:"smooth"})}
$("pcl").onclick=()=>{S.cur=null;$("ws").hidden=true};
$("prst").onclick=()=>{const p=PROJ.find(x=>x.id===S.cur);$("pcode").value=p.code;S.proj[p.id].code=p.code};
$("prun").onclick=async()=>{const p=PROJ.find(x=>x.id===S.cur),st=S.proj[p.id],code=$("pcode").value;st.code=code;$("pout").textContent="Running…";let r;
 try{r=p.l==="Python"?await runPy(code):p.l==="Java"?await runJava(code):await execJS(code,p.l==="HTML")}catch(e){r={err:String(e)}}
 if(p.l==="HTML"&&!r.err){const h=htmlCheck(code);if(h)r.err=h}
 $("pout").textContent=r.err?"✖ "+r.err:(p.l==="HTML"?"Preview is above.":(r.out||"(no output)"));
 const fb=(k,m)=>$("fb").innerHTML=`<div class="fb ${k}">${m}</div>`;
 if(r.err){st.hadErr=true;persist();return fb("bad","🐞 "+coach(r.err,r.line))}
 p.steps.forEach((s,i)=>{st.ok[i]=s.re.test(code)&&(!s.out||s.out.test(r.out||""))});
 const nx=p.steps.findIndex((s,i)=>!st.ok[i]);
 if(nx<0){if(!st.done){st.done=true;const bonus=st.hadErr;fb("good","🎉 Project complete! +100 XP"+(bonus?" and +10 for debugging it":""));steps();add(100+(bonus?10:0))}else{fb("good","🎉 Still working. Nice.");steps()}}
 else{fb("good","✔ It runs with no errors. Next: "+p.steps[nx].t+"<br><span class='mute'>Hint: "+p.steps[nx].h+"</span>");steps();persist()}};
$("learn").onclick=()=>add(15);$("nextTip").onclick=()=>{S.tip++;render()};
$("save").onclick=()=>{if(S.cur&&S.proj[S.cur])S.proj[S.cur].code=$("pcode").value;if(persist())toast("Progress saved")};
$("reset").onclick=()=>{if(confirm("Delete all progress? This can't be undone.")){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();$("ws").hidden=true;$("saved").textContent="Progress deleted.";render()}};
let timer=null;
function arm(){clearInterval(timer);if(!S.remind)return;let fired="";timer=setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
 if(hm===S.remind&&fired!==today()+hm){fired=today()+hm;try{new Notification("CodeQuest",{body:"Time to code. Finish one quest today."})}catch(e){toast("Time to code!")}}},20000)}
$("rem").onclick=async()=>{if(S.remind){S.remind=null;persist();$("rem").textContent="Turn on";clearInterval(timer);toast("Reminder off");return}
 try{const p=await Notification.requestPermission();if(p!=="granted"){toast("Allow notifications to use reminders");return}}catch(e){toast("Notifications not supported here");return}
 S.remind=$("rt").value;persist();$("rem").textContent="Turn off ("+S.remind+")";arm();toast("Reminder set for "+S.remind)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();S.cur=null;if(S.remind){$("rt").value=S.remind;$("rem").textContent="Turn off ("+S.remind+")";arm()}render();
